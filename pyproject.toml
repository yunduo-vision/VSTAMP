[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vstamp-reproduction"
version = "0.1.0"
description = "Research reproduction of VSTAMP"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "dpkt>=1.9.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "tensorboard>=2.14"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vstamp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

